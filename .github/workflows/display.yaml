name: Jelajah KBS CI/CD Deployment

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  tests-build:
    name: Run Tests & Build Assets
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for smoke tests
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test

      - name: Build production website
        if: github.event_name == 'push'
        run: npm run deploy
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}

      - name: Package production website
        if: github.event_name == 'push'
        run: tar -czf jelajah-kbs-deploy.tar.gz -C dist/deploy .

      - name: Upload production website
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: jelajah-kbs-deploy
          path: jelajah-kbs-deploy.tar.gz
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy to Live Hosting
    needs: tests-build
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04

    steps:
      - name: Download production website
        uses: actions/download-artifact@v4
        with:
          name: jelajah-kbs-deploy
          path: .

      - name: Upload website archive to CloudPanel
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || '22' }}
          source: jelajah-kbs-deploy.tar.gz
          target: /tmp

      - name: Extract website on CloudPanel
        uses: appleboy/ssh-action@v1.2.5
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/home/jelajahkbs/htdocs/jelajahkbs.cloudcomp.my.id' }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || '22' }}
          envs: DEPLOY_PATH
          script: |
            set -eu
            mkdir -p "$DEPLOY_PATH"
            find "$DEPLOY_PATH" -mindepth 1 -maxdepth 1 ! -name '.well-known' -exec rm -rf -- {} +
            tar --no-same-owner --no-same-permissions --no-overwrite-dir -xzf /tmp/jelajah-kbs-deploy.tar.gz -C "$DEPLOY_PATH"
            rm -f /tmp/jelajah-kbs-deploy.tar.gz
