name: Jelajah KBS CI/CD Deployment

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  tests-build:
    name: Run Tests & Build Assets
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for smoke tests
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test

      - name: Build production website
        if: github.event_name == 'push'
        run: npm run deploy
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}

      - name: Upload production website
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: jelajah-kbs-deploy
          path: dist/deploy/
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy to Live Hosting
    needs: tests-build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Download production website
        uses: actions/download-artifact@v4
        with:
          name: jelajah-kbs-deploy
          path: dist/deploy/

      - name: Deploy to CloudPanel over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -eu
          for name in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_KNOWN_HOSTS DEPLOY_PATH; do
            if [ -z "${!name}" ]; then
              echo "Required GitHub secret is missing: $name" >&2
              exit 1
            fi
          done

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          eval "$(ssh-agent -s)"
          trap 'ssh-agent -k' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" | ssh-add -

          rsync -az --delete --exclude='/.well-known/' \
            -e "ssh -p $SSH_PORT" \
            dist/deploy/ "$SSH_USER@$SSH_HOST:${DEPLOY_PATH%/}/"
